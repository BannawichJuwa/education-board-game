# ---------------------------------------------------------------
# Default profile: embedded H2 database stored in ./data (no install needed)
# Run with the "mysql" profile on Google Cloud (see application-mysql.properties)
# ---------------------------------------------------------------
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/eduboard;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Tables are created from schema.sql (same file as the ERD), not by Hibernate
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 console: http://localhost:8080/h2-console  (JDBC URL above, user sa, empty password)
spring.h2.console.enabled=true

# Secret used to sign login tokens. Set APP_TOKEN_SECRET in production.
app.token-secret=${APP_TOKEN_SECRET:change-this-secret-for-local-use-only}

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
