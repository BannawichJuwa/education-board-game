    <script>
      (function() {
        try {
          var saved = localStorage.getItem('eduboard.theme') || localStorage.getItem('classroom_theme') || 'auto';
          var effective = saved;
          if (saved === 'auto') {
            effective = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else if (saved === 'night') {
            effective = 'dark';
          } else if (saved === 'day') {
            effective = 'light';
          }
          document.documentElement.setAttribute('data-theme', effective);
          document.documentElement.setAttribute('data-theme-mode', saved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen antialiased selection:bg-[#FFE36E] selection:text-[#4A3D8F]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
